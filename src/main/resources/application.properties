server.port=${SERVER_PORT:8080}
spring.application.name=shoonya-trading-bot

# Lowest Volume Reversal & Continuation Strategy (5-min Intraday Cash MIS)
trading-bot.strategy.lowest-volume.enabled=${LVR_ENABLED:true}
trading-bot.strategy.lowest-volume.scheduler-enabled=${LVR_SCHEDULER_ENABLED:true}
trading-bot.strategy.lowest-volume.scanner-cron=${LVR_SCANNER_CRON:10 25 9 ? * MON-FRI}
trading-bot.strategy.lowest-volume.cron=${LVR_CRON:10 */5 9-11 ? * MON-FRI}
trading-bot.strategy.lowest-volume.paper-capital=${LVR_PAPER_CAPITAL:1000000.0}
trading-bot.strategy.lowest-volume.risk-per-trade-percent=${LVR_RISK_PER_TRADE:1.0}
trading-bot.strategy.lowest-volume.max-concurrent-trades=${LVR_MAX_CONCURRENT_TRADES:5}
trading-bot.strategy.lowest-volume.min-pct-change=${LVR_MIN_PCT_CHANGE:0.0}
trading-bot.strategy.lowest-volume.top-n-stocks=${LVR_TOP_N_STOCKS:10}
trading-bot.strategy.lowest-volume.setup-timeout-candles=${LVR_TIMEOUT_CANDLES:6}
trading-bot.strategy.lowest-volume.telegram-alerts=${LVR_TELEGRAM_ALERTS:true}
trading-bot.strategy.lowest-volume.telegram-armed-alerts=${LVR_TELEGRAM_ARMED_ALERTS:false}
trading-bot.strategy.lowest-volume.option-buying-enabled=${LVR_OPTION_BUYING:true}
trading-bot.strategy.lowest-volume.live-breach-check-enabled=${LVR_LIVE_BREACH_CHECK:true}
trading-bot.strategy.lowest-volume.lots=${LVR_LOTS:4}

# RSI Crossover Options Strategy (NIFTY / SENSEX)
trading-bot.strategy.rsi-crossover.enabled=${RSI_CROSSOVER_ENABLED:true}
trading-bot.strategy.rsi-crossover.underlying-index=${RSI_CROSSOVER_INDEX:NIFTY}
trading-bot.strategy.rsi-crossover.exchange=${RSI_CROSSOVER_EXCHANGE:NSE}
trading-bot.strategy.rsi-crossover.token=${RSI_CROSSOVER_TOKEN:10576}
trading-bot.strategy.rsi-crossover.symbol=${RSI_CROSSOVER_SYMBOL:NIFTY 50}
trading-bot.strategy.rsi-crossover.mode=${RSI_CROSSOVER_MODE:OPTION_SELLING}
trading-bot.strategy.rsi-crossover.scheduler-enabled=${RSI_CROSSOVER_SCHEDULER_ENABLED:true}
trading-bot.strategy.rsi-crossover.cron=${RSI_CROSSOVER_CRON:10 */5 9-15 ? * MON-FRI}
trading-bot.strategy.rsi-crossover.square-off-cron=${RSI_CROSSOVER_SQUARE_OFF_CRON:10 5 15 ? * MON-FRI}
trading-bot.strategy.rsi-crossover.auto-execute=${RSI_CROSSOVER_AUTO_EXECUTE:false}
trading-bot.strategy.rsi-crossover.lots=${RSI_CROSSOVER_LOTS:1}
trading-bot.strategy.rsi-crossover.lot-size=${RSI_CROSSOVER_LOT_SIZE:65}
trading-bot.strategy.rsi-crossover.rsi-period=${RSI_CROSSOVER_RSI_PERIOD:14}
trading-bot.strategy.rsi-crossover.adx-filter-enabled=${RSI_CROSSOVER_ADX_FILTER_ENABLED:true}
trading-bot.strategy.rsi-crossover.adx-threshold=${RSI_CROSSOVER_ADX_THRESHOLD:22.0}
trading-bot.strategy.rsi-crossover.vwap-filter-enabled=${RSI_CROSSOVER_VWAP_FILTER_ENABLED:true}
trading-bot.strategy.rsi-crossover.vwap-max-distance=${RSI_CROSSOVER_VWAP_MAX_DISTANCE:35.0}
trading-bot.strategy.rsi-crossover.supertrend-filter-enabled=${RSI_CROSSOVER_SUPERTREND_FILTER_ENABLED:true}
trading-bot.strategy.rsi-crossover.supertrend-period=${RSI_CROSSOVER_SUPERTREND_PERIOD:10}
trading-bot.strategy.rsi-crossover.supertrend-multiplier=${RSI_CROSSOVER_SUPERTREND_MULTIPLIER:2.0}
trading-bot.strategy.rsi-crossover.di-filter-enabled=${RSI_CROSSOVER_DI_FILTER_ENABLED:true}
trading-bot.strategy.rsi-crossover.stop-loss-percent=${RSI_CROSSOVER_STOP_LOSS_PERCENT:2.0}
trading-bot.strategy.rsi-crossover.trailing-sl-enabled=${RSI_CROSSOVER_TRAILING_SL_ENABLED:true}
trading-bot.strategy.rsi-crossover.trail-step-1-trigger=${RSI_CROSSOVER_TRAIL_STEP_1_TRIGGER:12.0}
trading-bot.strategy.rsi-crossover.trail-step-1-lock=${RSI_CROSSOVER_TRAIL_STEP_1_LOCK:2.0}
trading-bot.strategy.rsi-crossover.trail-step-2-trigger=${RSI_CROSSOVER_TRAIL_STEP_2_TRIGGER:25.0}
trading-bot.strategy.rsi-crossover.trail-step-2-lock=${RSI_CROSSOVER_TRAIL_STEP_2_LOCK:15.0}
trading-bot.strategy.rsi-crossover.target-profit-percent=${RSI_CROSSOVER_TARGET_PROFIT_PERCENT:50.0}
trading-bot.strategy.rsi-crossover.hedge-enabled=${RSI_CROSSOVER_HEDGE_ENABLED:true}
trading-bot.strategy.rsi-crossover.hedge-otm-percent=${RSI_CROSSOVER_HEDGE_OTM_PERCENT:2.0}
trading-bot.strategy.rsi-crossover.prefer-weekly=${RSI_CROSSOVER_PREFER_WEEKLY:true}
trading-bot.strategy.rsi-crossover.max-trades-per-day=${RSI_CROSSOVER_MAX_TRADES_PER_DAY:1}
trading-bot.strategy.rsi-crossover.telegram-alerts=${RSI_CROSSOVER_TELEGRAM_ALERTS:true}

# NIFTY Bollinger Band (20, 2) & Heikin-Ashi Positional Strategy
trading-bot.positional.enabled=${POSITIONAL_ENABLED:true}
trading-bot.positional.cron=${POSITIONAL_CRON:0 0 15 * * MON-FRI}
trading-bot.positional.symbol=${POSITIONAL_SYMBOL:NIFTY 50}
trading-bot.positional.execution-mode=${POSITIONAL_EXECUTION_MODE:MANUAL_CONFIRMATION}
trading-bot.positional.num-lots=${POSITIONAL_NUM_LOTS:10}
trading-bot.positional.quantity=${POSITIONAL_QUANTITY:65}
trading-bot.positional.hedge-offset-points=${POSITIONAL_HEDGE_OFFSET_POINTS:300}
trading-bot.positional.max-risk-rupees=${POSITIONAL_MAX_RISK_RUPEES:100000.0}
trading-bot.positional.state-file-path=${POSITIONAL_STATE_FILE_PATH:data/bb_rsi_positional_state.json}

# Logging Configuration
logging.file.name=${LOGGING_FILE_NAME:logs/shoonya-trading-bot.log}


