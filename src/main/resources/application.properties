# ==============================================================================
# Cumulative Average Reversal (CAR) Weekly GTT Strategy
# ==============================================================================
trading-bot.strategy.car-weekly.enabled=${CAR_ENABLED:true}
trading-bot.strategy.car-weekly.total-capital=${CAR_TOTAL_CAPITAL:1000000.0}
trading-bot.strategy.car-weekly.num-parts=${CAR_NUM_PARTS:40}
trading-bot.strategy.car-weekly.profit-target-pct=${CAR_PROFIT_TARGET_PCT:6.28}
trading-bot.strategy.car-weekly.trigger-buffer=${CAR_TRIGGER_BUFFER:0.10}
trading-bot.strategy.car-weekly.car-positive-days=${CAR_POSITIVE_DAYS:10}
trading-bot.strategy.car-weekly.high-lookback-days=${CAR_HIGH_LOOKBACK_DAYS:252}
trading-bot.strategy.car-weekly.sunday-cron=${CAR_WEEKLY_SUNDAY_CRON:0 0 10 ? * SUN}
trading-bot.strategy.car-weekly.telegram-alerts=${CAR_TELEGRAM_ALERTS:true}
trading-bot.strategy.car-weekly.sync-demat-holdings=${CAR_SYNC_DEMAT_HOLDINGS:false}
# Single broker the weekly routine arms triggers on while running LIVE. PAPER mode always routes
# to the local watcher, so this value is never reached unless CAR_WEEKLY_GTT resolves to LIVE.
trading-bot.strategy.car-weekly.execution-broker=${CAR_GTT_BROKER:ZERODHA}
trading-bot.strategy.car-weekly.accumulation-only-symbols=${CAR_ACCUMULATION_ONLY_SYMBOLS:}







# ==============================================================================
# Monthly Option Range GARCH(1,1) Quantitative Strategy
# ==============================================================================
trading-bot.strategy.monthly-range.enabled=${MONTHLY_RANGE_ENABLED:true}
trading-bot.strategy.monthly-range.cron=${MONTHLY_RANGE_CRON:0 0 10 ? * MON-FRI}
trading-bot.strategy.monthly-range.symbols=${MONTHLY_RANGE_SYMBOLS:RELIANCE,TCS,HDFCBANK,INFY,ICICIBANK,SBIN,TATAMOTORS,NIFTY50}
trading-bot.strategy.monthly-range.forecast-horizon-days=${MONTHLY_RANGE_HORIZON_DAYS:22}
trading-bot.strategy.monthly-range.history-lookback-days=${MONTHLY_RANGE_LOOKBACK_DAYS:504}
trading-bot.strategy.monthly-range.telegram-alerts-enabled=${MONTHLY_RANGE_TELEGRAM_ALERTS:true}

