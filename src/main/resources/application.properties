# ==============================================================================
# Silver ORB — MCX silver futures evening-session paper strategy (validation run)
# Rules (validated vs scripts/silver_orb_vwap_futures_backtest.py on 4 datasets):
#   * ORB = high/low of the 18:00-18:30 IST 5m bars (opening 18:00..18:25).
#   * Bias = first 5m close beyond ORB high/low after 18:30; flips on opposite break.
#   * Entry = 5m close crossing the calendar-day (00:00 IST) VWAP in the bias
#     direction; one trade/day; no entries at/after 21:00; square-off 23:00 IST.
#   * SL -7% / target +25% of MARGIN at 10% margin => 0.70% / 2.50% of price,
#     SL-before-TGT on same bar (conservative). PAPER only, never places orders.
# MCX token 495214 = SILVER04DEC26 (main 30kg contract, expires ~04-Dec-2026):
# roll token+symbol before expiry if the run extends past it.
# ==============================================================================
trading-bot.strategy.silver-orb.enabled=${SILVER_ORB_ENABLED:true}
trading-bot.strategy.silver-orb.scheduler-enabled=${SILVER_ORB_SCHEDULER_ENABLED:true}
trading-bot.strategy.silver-orb.telegram-alerts-enabled=${SILVER_ORB_TELEGRAM_ALERTS_ENABLED:true}
trading-bot.strategy.silver-orb.cron=${SILVER_ORB_CRON:20 */5 18-23 ? * MON-FRI}
trading-bot.strategy.silver-orb.exch=${SILVER_ORB_EXCH:MCX}
trading-bot.strategy.silver-orb.token=${SILVER_ORB_TOKEN:495214}
trading-bot.strategy.silver-orb.symbol=${SILVER_ORB_SYMBOL:SILVER04DEC26}
trading-bot.strategy.silver-orb.timeframe=${SILVER_ORB_TIMEFRAME:5}
trading-bot.strategy.silver-orb.kg-per-lot=${SILVER_ORB_KG_PER_LOT:30}
trading-bot.strategy.silver-orb.lots=${SILVER_ORB_LOTS:1}
trading-bot.strategy.silver-orb.margin-pct=${SILVER_ORB_MARGIN_PCT:10}
trading-bot.strategy.silver-orb.risk-pct=${SILVER_ORB_RISK_PCT:7}
trading-bot.strategy.silver-orb.target-pct=${SILVER_ORB_TARGET_PCT:25}
trading-bot.strategy.silver-orb.min-orb-bars=${SILVER_ORB_MIN_ORB_BARS:4}
trading-bot.strategy.silver-orb.min-orb-range-pct=${SILVER_ORB_MIN_ORB_RANGE_PCT:0.05}
trading-bot.strategy.silver-orb.orb-start=${SILVER_ORB_ORB_START:18:00}
trading-bot.strategy.silver-orb.orb-end=${SILVER_ORB_ORB_END:18:30}
trading-bot.strategy.silver-orb.entry-cutoff=${SILVER_ORB_ENTRY_CUTOFF:21:00}
trading-bot.strategy.silver-orb.square-off=${SILVER_ORB_SQUARE_OFF:23:00}
trading-bot.strategy.silver-orb.run-until=${SILVER_ORB_RUN_UNTIL:2026-11-14}
trading-bot.strategy.silver-orb.state-file=${SILVER_ORB_STATE_FILE:./data/silver-orb-state.json}

