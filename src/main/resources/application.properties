server.port=${SERVER_PORT:8080}
spring.application.name=shoonya-trading-bot
spring.task.scheduling.pool.size=${TASK_SCHEDULING_POOL_SIZE:5}
spring.task.scheduling.thread-name-prefix=trading-task-

# Lowest Volume Reversal & Continuation Strategy (5-min Intraday Cash MIS)
trading-bot.strategy.lowest-volume.enabled=${LVR_ENABLED:true}
trading-bot.strategy.lowest-volume.scheduler-enabled=${LVR_SCHEDULER_ENABLED:true}
trading-bot.strategy.lowest-volume.scanner-cron=${LVR_SCANNER_CRON:10 25 9 ? * MON-FRI}
trading-bot.strategy.lowest-volume.cron=${LVR_CRON:10 */5 9-15 ? * MON-FRI}
trading-bot.strategy.lowest-volume.paper-capital=${LVR_PAPER_CAPITAL:1000000.0}
trading-bot.strategy.lowest-volume.risk-per-trade-percent=${LVR_RISK_PER_TRADE:1.0}
trading-bot.strategy.lowest-volume.max-concurrent-trades=${LVR_MAX_CONCURRENT_TRADES:5}
trading-bot.strategy.lowest-volume.min-pct-change=${LVR_MIN_PCT_CHANGE:0.0}
trading-bot.strategy.lowest-volume.top-n-stocks=${LVR_TOP_N_STOCKS:10}
trading-bot.strategy.lowest-volume.setup-timeout-candles=${LVR_TIMEOUT_CANDLES:6}
trading-bot.strategy.lowest-volume.telegram-alerts=${LVR_TELEGRAM_ALERTS:true}
trading-bot.strategy.lowest-volume.telegram-armed-alerts=${LVR_TELEGRAM_ARMED_ALERTS:true}
trading-bot.strategy.lowest-volume.option-buying-enabled=${LVR_OPTION_BUYING:true}
trading-bot.strategy.lowest-volume.live-breach-check-enabled=${LVR_LIVE_BREACH_CHECK:true}
trading-bot.strategy.lowest-volume.lots=${LVR_LOTS:4}
trading-bot.strategy.lowest-volume.scanner-fallback-cutoff=${LVR_SCANNER_FALLBACK_CUTOFF:10:00}
trading-bot.strategy.lowest-volume.scanner-timeout-seconds=${LVR_SCANNER_TIMEOUT_SECONDS:45}



# NIFTY Bollinger Band (20, 2) & Heikin-Ashi Positional Strategy
trading-bot.positional.enabled=${POSITIONAL_ENABLED:false}
trading-bot.positional.cron=${POSITIONAL_CRON:0 0 15 * * MON-FRI}
trading-bot.positional.symbol=${POSITIONAL_SYMBOL:NIFTY 50}
trading-bot.positional.execution-mode=${POSITIONAL_EXECUTION_MODE:MANUAL_CONFIRMATION}
trading-bot.positional.num-lots=${POSITIONAL_NUM_LOTS:10}
trading-bot.positional.quantity=${POSITIONAL_QUANTITY:65}
trading-bot.positional.hedge-offset-points=${POSITIONAL_HEDGE_OFFSET_POINTS:300}
trading-bot.positional.max-risk-rupees=${POSITIONAL_MAX_RISK_RUPEES:100000.0}
trading-bot.positional.state-file-path=${POSITIONAL_STATE_FILE_PATH:data/bb_rsi_positional_state.json}

# RSI Highway Multi-Timeframe Swing Strategy (Nifty 500 Equities)
trading-bot.strategy.rsi-highway.enabled=${RSI_HIGHWAY_ENABLED:false}
trading-bot.strategy.rsi-highway.eod-scan-cron=${RSI_HIGHWAY_EOD_CRON:0 0 15 * * MON-FRI}
trading-bot.strategy.rsi-highway.morning-check-cron=${RSI_HIGHWAY_MORNING_CRON:0 30 9 * * MON-FRI}
trading-bot.strategy.rsi-highway.monthly-rsi-threshold=${RSI_HIGHWAY_MONTHLY_RSI:60.0}
trading-bot.strategy.rsi-highway.weekly-rsi-threshold=${RSI_HIGHWAY_WEEKLY_RSI:60.0}
trading-bot.strategy.rsi-highway.daily-rsi-lower=${RSI_HIGHWAY_DAILY_RSI_LOWER:48.0}
trading-bot.strategy.rsi-highway.daily-rsi-upper=${RSI_HIGHWAY_DAILY_RSI_UPPER:55.0}
trading-bot.strategy.rsi-highway.daily-rsi-exit=${RSI_HIGHWAY_DAILY_RSI_EXIT:50.0}
trading-bot.strategy.rsi-highway.morning-emergency-rsi=${RSI_HIGHWAY_EMERGENCY_RSI:45.0}
trading-bot.strategy.rsi-highway.max-tranches=${RSI_HIGHWAY_MAX_TRANCHES:3}
trading-bot.strategy.rsi-highway.max-concurrent-positions=${RSI_HIGHWAY_MAX_POSITIONS:10}
trading-bot.strategy.rsi-highway.risk-per-trade-percent=${RSI_HIGHWAY_RISK_PER_TRADE:1.0}
trading-bot.strategy.rsi-highway.max-capital-per-stock-percent=${RSI_HIGHWAY_MAX_CAPITAL_PER_STOCK:10.0}
trading-bot.strategy.rsi-highway.paper-capital=${RSI_HIGHWAY_PAPER_CAPITAL:1000000.0}
trading-bot.strategy.rsi-highway.paper-trading=${RSI_HIGHWAY_PAPER_TRADING:true}
trading-bot.strategy.rsi-highway.min-52w-leaders=${RSI_HIGHWAY_MIN_LEADERS:5}
trading-bot.strategy.rsi-highway.max-index-drawdown-pct=${RSI_HIGHWAY_MAX_INDEX_DRAWDOWN:0.20}
trading-bot.strategy.rsi-highway.state-file-path=${RSI_HIGHWAY_STATE_FILE:data/rsi_highway_state.json}
trading-bot.strategy.rsi-highway.telegram-alerts=${RSI_HIGHWAY_TELEGRAM_ALERTS:true}
trading-bot.strategy.rsi-highway.scan-delay-ms=${RSI_HIGHWAY_SCAN_DELAY_MS:110}

# Historical OHLC Data Storage & Daily SQLite Backup
spring.datasource.url=jdbc:sqlite:${SQLITE_DB_PATH:data/trading_bot.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
trading-bot.ohlc.sqlite-db-path=${SQLITE_DB_PATH:data/trading_bot.db}
trading-bot.ohlc.cache-file-path=${OHLC_CACHE_FILE_PATH:data/historical_ohlc.json}
trading-bot.ohlc.json-backup-enabled=${OHLC_JSON_BACKUP_ENABLED:true}
trading-bot.ohlc.backup-dir=${SQLITE_BACKUP_DIR:data/backups}
trading-bot.ohlc.backup-retention-days=${SQLITE_BACKUP_RETENTION_DAYS:7}
trading-bot.ohlc.daily-backup-cron=${OHLC_DAILY_BACKUP_CRON:0 0 23 * * ?}

# KISS (Keep It Swing Systematic) Multi-Timeframe Strategy
trading-bot.strategy.kiss.enabled=${KISS_ENABLED:false}
trading-bot.strategy.kiss.ema-period=${KISS_EMA_PERIOD:55}
trading-bot.strategy.kiss.macd-fast-period=${KISS_MACD_FAST:12}
trading-bot.strategy.kiss.macd-slow-period=${KISS_MACD_SLOW:26}
trading-bot.strategy.kiss.macd-signal-period=${KISS_MACD_SIGNAL:9}
trading-bot.strategy.kiss.risk-reward-ratio=${KISS_RR_RATIO:3.0}
trading-bot.strategy.kiss.max-risk-per-trade-pct=${KISS_MAX_RISK_PER_TRADE_PCT:0.015}
trading-bot.strategy.kiss.paper-capital=${KISS_PAPER_CAPITAL:500000.0}
trading-bot.strategy.kiss.max-concurrent-positions=${KISS_MAX_POSITIONS:10}
trading-bot.strategy.kiss.timeframe=${KISS_TIMEFRAME:60}
trading-bot.strategy.kiss.state-file-path=${KISS_STATE_FILE:data/kiss_strategy_state.json}
trading-bot.strategy.kiss.enable-weekend-exit=${KISS_WEEKEND_EXIT:true}
trading-bot.strategy.kiss.scan-delay-ms=${KISS_SCAN_DELAY_MS:50}
trading-bot.strategy.kiss.nse-hourly-cron=${KISS_NSE_HOURLY_CRON:0 15 10-15 ? * MON-FRI}
trading-bot.strategy.kiss.mcx-hourly-cron=${KISS_MCX_HOURLY_CRON:0 0 10-23 ? * MON-FRI}

# Logging Configuration
logging.file.name=${LOGGING_FILE_NAME:logs/shoonya-trading-bot.log}


