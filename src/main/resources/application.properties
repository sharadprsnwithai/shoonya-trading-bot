server.port=${SERVER_PORT:8080}
spring.application.name=shoonya-trading-bot
spring.task.scheduling.pool.size=${TASK_SCHEDULING_POOL_SIZE:5}
spring.task.scheduling.thread-name-prefix=trading-task-

# Shoonya streaming market-data feed (WebSocket). Replaces the per-symbol GetQuotes REST loop for
# bulk quote reads; the broker documents ~1 market-data request/second/instrument on REST and
# advises batching via this feed instead. Disable to fall back entirely to the REST path.
trading-bot.shoonya.feed.enabled=${SHOONYA_FEED_ENABLED:true}
trading-bot.shoonya.feed.uri=${SHOONYA_FEED_URI:wss://api.shoonya.com/NorenWSAPI/}
trading-bot.shoonya.feed.connect-timeout-seconds=${SHOONYA_FEED_CONNECT_TIMEOUT_SECONDS:10}
trading-bot.shoonya.feed.reconnect-initial-backoff-seconds=${SHOONYA_FEED_RECONNECT_INITIAL_BACKOFF_SECONDS:1}
trading-bot.shoonya.feed.reconnect-max-backoff-seconds=${SHOONYA_FEED_RECONNECT_MAX_BACKOFF_SECONDS:60}
trading-bot.shoonya.feed.max-tokens-per-frame=${SHOONYA_FEED_MAX_TOKENS_PER_FRAME:200}
trading-bot.shoonya.feed.snapshot-max-age-ms=${SHOONYA_FEED_SNAPSHOT_MAX_AGE_MS:60000}
# The gateway reaps an idle session after ~60s (observed live: clean close, status 1006), so
# heartbeat well inside that. Must stay below the reap interval.
trading-bot.shoonya.feed.keep-alive-seconds=${SHOONYA_FEED_KEEPALIVE_SECONDS:30}
trading-bot.shoonya.feed.warmup-timeout-ms=${SHOONYA_FEED_WARMUP_TIMEOUT_MS:4000}
trading-bot.shoonya.feed.min-warmup-coverage-pct=${SHOONYA_FEED_MIN_WARMUP_COVERAGE_PCT:60.0}

# Lowest Volume Reversal (LVR) Strategy (5-min Intraday Stock Futures Buying & Selling)
