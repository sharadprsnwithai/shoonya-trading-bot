server.port=${SERVER_PORT:8080}
spring.application.name=shoonya-trading-bot

# Pivot SuperTrend Strategy Production Scheduler
trading-bot.strategy.pivot-supertrend.scheduler-enabled=${STRATEGY_SCHEDULER_ENABLED:true}
trading-bot.strategy.pivot-supertrend.auto-execute=${STRATEGY_AUTO_EXECUTE:false}
trading-bot.strategy.pivot-supertrend.lots=${STRATEGY_LOTS:1}
trading-bot.strategy.pivot-supertrend.lot-size=${STRATEGY_LOT_SIZE:65}
trading-bot.strategy.pivot-supertrend.lot-quantity=${STRATEGY_LOT_QUANTITY:65}
trading-bot.strategy.pivot-supertrend.max-daily-trades=${STRATEGY_MAX_DAILY_TRADES:1}
trading-bot.strategy.pivot-supertrend.buy-hedge=${STRATEGY_BUY_HEDGE:true}
trading-bot.strategy.pivot-supertrend.hedge-distance=${STRATEGY_HEDGE_DISTANCE:150}
trading-bot.strategy.pivot-supertrend.oi-filter-enabled=${STRATEGY_OI_FILTER_ENABLED:false}
trading-bot.strategy.pivot-supertrend.oi-diff-threshold=${STRATEGY_OI_DIFF_THRESHOLD:5000000}
trading-bot.strategy.pivot-supertrend.oi-directional=${STRATEGY_OI_DIRECTIONAL:true}
trading-bot.strategy.pivot-supertrend.entry-start-time=${STRATEGY_ENTRY_START_TIME:09:30:00}
trading-bot.strategy.pivot-supertrend.stop-loss-enabled=${STRATEGY_STOP_LOSS_ENABLED:true}
trading-bot.strategy.pivot-supertrend.stop-loss-percent=${STRATEGY_STOP_LOSS_PERCENT:30.0}
trading-bot.strategy.pivot-supertrend.target-profit-enabled=${STRATEGY_TARGET_PROFIT_ENABLED:true}
trading-bot.strategy.pivot-supertrend.target-profit-percent=${STRATEGY_TARGET_PROFIT_PERCENT:50.0}


# Lowest Volume Reversal & Continuation Strategy (5-min Intraday Cash MIS)
trading-bot.strategy.lowest-volume.enabled=${LVR_ENABLED:true}
trading-bot.strategy.lowest-volume.scheduler-enabled=${LVR_SCHEDULER_ENABLED:true}
trading-bot.strategy.lowest-volume.scanner-cron=${LVR_SCANNER_CRON:10 25 9 ? * MON-FRI}
trading-bot.strategy.lowest-volume.cron=${LVR_CRON:10 */5 9-11 ? * MON-FRI}
trading-bot.strategy.lowest-volume.paper-capital=${LVR_PAPER_CAPITAL:1000000.0}
trading-bot.strategy.lowest-volume.risk-per-trade-percent=${LVR_RISK_PER_TRADE:1.0}
trading-bot.strategy.lowest-volume.max-concurrent-trades=${LVR_MAX_CONCURRENT_TRADES:5}
trading-bot.strategy.lowest-volume.min-pct-change=${LVR_MIN_PCT_CHANGE:1.0}
trading-bot.strategy.lowest-volume.top-n-stocks=${LVR_TOP_N_STOCKS:10}
trading-bot.strategy.lowest-volume.setup-timeout-candles=${LVR_TIMEOUT_CANDLES:6}
trading-bot.strategy.lowest-volume.telegram-alerts=${LVR_TELEGRAM_ALERTS:true}
trading-bot.strategy.lowest-volume.option-buying-enabled=${LVR_OPTION_BUYING:true}
trading-bot.strategy.lowest-volume.live-breach-check-enabled=${LVR_LIVE_BREACH_CHECK:true}
trading-bot.strategy.lowest-volume.lots=${LVR_LOTS:4}

# NIFTY 5m vs 15m RSI Crossover Options Strategy
trading-bot.strategy.rsi-crossover.enabled=${RSI_CROSSOVER_ENABLED:true}
trading-bot.strategy.rsi-crossover.mode=${RSI_CROSSOVER_MODE:OPTION_SELLING}
trading-bot.strategy.rsi-crossover.scheduler-enabled=${RSI_CROSSOVER_SCHEDULER_ENABLED:true}
trading-bot.strategy.rsi-crossover.cron=${RSI_CROSSOVER_CRON:10 */5 9-15 ? * MON-FRI}
trading-bot.strategy.rsi-crossover.square-off-cron=${RSI_CROSSOVER_SQUARE_OFF_CRON:10 5 15 ? * MON-FRI}
trading-bot.strategy.rsi-crossover.auto-execute=${RSI_CROSSOVER_AUTO_EXECUTE:false}
trading-bot.strategy.rsi-crossover.lots=${RSI_CROSSOVER_LOTS:1}
trading-bot.strategy.rsi-crossover.lot-size=${RSI_CROSSOVER_LOT_SIZE:65}
trading-bot.strategy.rsi-crossover.rsi-period=${RSI_CROSSOVER_RSI_PERIOD:14}
trading-bot.strategy.rsi-crossover.adx-filter-enabled=${RSI_CROSSOVER_ADX_FILTER_ENABLED:true}
trading-bot.strategy.rsi-crossover.adx-threshold=${RSI_CROSSOVER_ADX_THRESHOLD:20.0}
trading-bot.strategy.rsi-crossover.stop-loss-percent=${RSI_CROSSOVER_STOP_LOSS_PERCENT:2.0}
trading-bot.strategy.rsi-crossover.target-profit-percent=${RSI_CROSSOVER_TARGET_PROFIT_PERCENT:50.0}
trading-bot.strategy.rsi-crossover.hedge-enabled=${RSI_CROSSOVER_HEDGE_ENABLED:true}
trading-bot.strategy.rsi-crossover.hedge-otm-percent=${RSI_CROSSOVER_HEDGE_OTM_PERCENT:2.0}
trading-bot.strategy.rsi-crossover.max-trades-per-day=${RSI_CROSSOVER_MAX_TRADES_PER_DAY:1}
trading-bot.strategy.rsi-crossover.telegram-alerts=${RSI_CROSSOVER_TELEGRAM_ALERTS:true}

# 19-Period Daily WMA Positional Hedged Option Selling Strategy
trading-bot.strategy.daily-wma.enabled=${DAILY_WMA_ENABLED:true}
trading-bot.strategy.daily-wma.scheduler-enabled=${DAILY_WMA_SCHEDULER_ENABLED:true}
trading-bot.strategy.daily-wma.mode=${DAILY_WMA_MODE:PAPER}
trading-bot.strategy.daily-wma.eval-cron=${DAILY_WMA_EVAL_CRON:10 30 9 ? * MON-FRI}
trading-bot.strategy.daily-wma.sl-cron=${DAILY_WMA_SL_CRON:10 */5 9-15 ? * MON-FRI}
trading-bot.strategy.daily-wma.square-off-cron=${DAILY_WMA_SQUARE_OFF_CRON:10 15 15 ? * MON-FRI}
trading-bot.strategy.daily-wma.symbol=${DAILY_WMA_SYMBOL:10576}
trading-bot.strategy.daily-wma.wma-period=${DAILY_WMA_PERIOD:19}
trading-bot.strategy.daily-wma.target-delta=${DAILY_WMA_TARGET_DELTA:0.22}
trading-bot.strategy.daily-wma.max-entry-premium=${DAILY_WMA_MAX_ENTRY_PREMIUM:105.0}
trading-bot.strategy.daily-wma.expiry-switch-day=${DAILY_WMA_EXPIRY_SWITCH_DAY:15}
trading-bot.strategy.daily-wma.hedge-otm-percent=${DAILY_WMA_HEDGE_OTM_PERCENT:0.02}
trading-bot.strategy.daily-wma.stop-loss-percent=${DAILY_WMA_STOP_LOSS_PERCENT:1.0}
trading-bot.strategy.daily-wma.allow-reentry=${DAILY_WMA_ALLOW_REENTRY:true}
trading-bot.strategy.daily-wma.lots=${DAILY_WMA_LOTS:1}
trading-bot.strategy.daily-wma.lot-size=${DAILY_WMA_LOT_SIZE:65}
trading-bot.strategy.daily-wma.state-file=${DAILY_WMA_STATE_FILE:data/wma_positional_state.json}

# Logging Configuration
logging.file.name=${LOGGING_FILE_NAME:logs/shoonya-trading-bot.log}


