trading-bot.strategy.silver-orb.exch=${SILVER_ORB_EXCH:MCX}
trading-bot.strategy.silver-orb.token=${SILVER_ORB_TOKEN:495214}
trading-bot.strategy.silver-orb.symbol=${SILVER_ORB_SYMBOL:SILVER04DEC26}
trading-bot.strategy.silver-orb.timeframe=${SILVER_ORB_TIMEFRAME:5}
trading-bot.strategy.silver-orb.kg-per-lot=${SILVER_ORB_KG_PER_LOT:30}
trading-bot.strategy.silver-orb.lots=${SILVER_ORB_LOTS:1}
trading-bot.strategy.silver-orb.margin-pct=${SILVER_ORB_MARGIN_PCT:10}
trading-bot.strategy.silver-orb.risk-pct=${SILVER_ORB_RISK_PCT:7}
trading-bot.strategy.silver-orb.target-pct=${SILVER_ORB_TARGET_PCT:25}
