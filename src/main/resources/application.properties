server.port=${SERVER_PORT:8080}
spring.application.name=shoonya-trading-bot

# Pivot SuperTrend Strategy Production Scheduler
trading-bot.strategy.pivot-supertrend.scheduler-enabled=${STRATEGY_SCHEDULER_ENABLED:true}
trading-bot.strategy.pivot-supertrend.auto-execute=${STRATEGY_AUTO_EXECUTE:false}
trading-bot.strategy.pivot-supertrend.lots=${STRATEGY_LOTS:1}
trading-bot.strategy.pivot-supertrend.lot-size=${STRATEGY_LOT_SIZE:65}
trading-bot.strategy.pivot-supertrend.lot-quantity=${STRATEGY_LOT_QUANTITY:65}
trading-bot.strategy.pivot-supertrend.max-daily-trades=${STRATEGY_MAX_DAILY_TRADES:1}
trading-bot.strategy.pivot-supertrend.buy-hedge=${STRATEGY_BUY_HEDGE:true}
trading-bot.strategy.pivot-supertrend.hedge-distance=${STRATEGY_HEDGE_DISTANCE:150}
trading-bot.strategy.pivot-supertrend.oi-filter-enabled=${STRATEGY_OI_FILTER_ENABLED:false}
trading-bot.strategy.pivot-supertrend.oi-diff-threshold=${STRATEGY_OI_DIFF_THRESHOLD:5000000}
trading-bot.strategy.pivot-supertrend.oi-directional=${STRATEGY_OI_DIRECTIONAL:true}
trading-bot.strategy.pivot-supertrend.entry-start-time=${STRATEGY_ENTRY_START_TIME:09:30:00}
trading-bot.strategy.pivot-supertrend.stop-loss-enabled=${STRATEGY_STOP_LOSS_ENABLED:true}
trading-bot.strategy.pivot-supertrend.stop-loss-percent=${STRATEGY_STOP_LOSS_PERCENT:30.0}
trading-bot.strategy.pivot-supertrend.target-profit-enabled=${STRATEGY_TARGET_PROFIT_ENABLED:true}
trading-bot.strategy.pivot-supertrend.target-profit-percent=${STRATEGY_TARGET_PROFIT_PERCENT:50.0}

# Triple SuperTrend + RSI Directional Options Strategy (NIFTY 50 & 29 Stocks)
trading-bot.strategy.triple-supertrend.enabled=${TRIPLE_ST_ENABLED:true}
trading-bot.strategy.triple-supertrend.mode=${TRIPLE_ST_MODE:OPTION_BUYING}
trading-bot.strategy.triple-supertrend.timeframe=${TRIPLE_ST_TIMEFRAME:60m}
trading-bot.strategy.triple-supertrend.fast-atr-period=${TRIPLE_ST_FAST_ATR:7}
trading-bot.strategy.triple-supertrend.fast-multiplier=${TRIPLE_ST_FAST_MULT:2.0}
trading-bot.strategy.triple-supertrend.medium-atr-period=${TRIPLE_ST_MEDIUM_ATR:10}
trading-bot.strategy.triple-supertrend.medium-multiplier=${TRIPLE_ST_MEDIUM_MULT:3.0}
trading-bot.strategy.triple-supertrend.slow-atr-period=${TRIPLE_ST_SLOW_ATR:14}
trading-bot.strategy.triple-supertrend.slow-multiplier=${TRIPLE_ST_SLOW_MULT:4.0}
trading-bot.strategy.triple-supertrend.rsi-period=${TRIPLE_ST_RSI_PERIOD:14}
trading-bot.strategy.triple-supertrend.rsi-filter-enabled=${TRIPLE_ST_RSI_FILTER:true}
trading-bot.strategy.triple-supertrend.rsi-lookback=${TRIPLE_ST_RSI_LOOKBACK:5}
trading-bot.strategy.triple-supertrend.rsi-bullish-min=${TRIPLE_ST_RSI_BULLISH_MIN:40.0}
trading-bot.strategy.triple-supertrend.rsi-bearish-max=${TRIPLE_ST_RSI_BEARISH_MAX:60.0}
trading-bot.strategy.triple-supertrend.stop-loss-enabled=${TRIPLE_ST_STOP_LOSS_ENABLED:true}
trading-bot.strategy.triple-supertrend.stop-loss-percent=${TRIPLE_ST_STOP_LOSS_PERCENT:30.0}
trading-bot.strategy.triple-supertrend.target-profit-enabled=${TRIPLE_ST_TARGET_PROFIT_ENABLED:true}
trading-bot.strategy.triple-supertrend.target-profit-percent=${TRIPLE_ST_TARGET_PROFIT_PERCENT:50.0}
trading-bot.strategy.triple-supertrend.dte-roll-threshold=${TRIPLE_ST_DTE_ROLL_THRESHOLD:10}
trading-bot.strategy.triple-supertrend.intraday-mode=${TRIPLE_ST_INTRADAY_MODE:false}
trading-bot.strategy.triple-supertrend.telegram-alerts=${TRIPLE_ST_TELEGRAM_ALERTS:true}
trading-bot.strategy.triple-supertrend.lots=${TRIPLE_ST_LOTS:1}
trading-bot.strategy.triple-supertrend.adx-filter-enabled=${TRIPLE_ST_ADX_FILTER_ENABLED:true}
trading-bot.strategy.triple-supertrend.adx-period=${TRIPLE_ST_ADX_PERIOD:14}
trading-bot.strategy.triple-supertrend.adx-threshold=${TRIPLE_ST_ADX_THRESHOLD:22.0}
trading-bot.strategy.triple-supertrend.rsi-bullish-max=${TRIPLE_ST_RSI_BULLISH_MAX:68.0}
trading-bot.strategy.triple-supertrend.rsi-bearish-min=${TRIPLE_ST_RSI_BEARISH_MIN:32.0}
trading-bot.strategy.triple-supertrend.cooldown-bars=${TRIPLE_ST_COOLDOWN_BARS:3}
trading-bot.strategy.triple-supertrend.credit-spread-enabled=${TRIPLE_ST_CREDIT_SPREAD_ENABLED:true}
trading-bot.strategy.triple-supertrend.hedge-strike-offset=${TRIPLE_ST_HEDGE_STRIKE_OFFSET:2}
trading-bot.strategy.triple-supertrend.symbol-basket=${TRIPLE_ST_SYMBOL_BASKET:CURATED}
trading-bot.strategy.triple-supertrend.rejection-wick-filter-enabled=${TRIPLE_ST_REJECTION_WICK_FILTER_ENABLED:true}
trading-bot.strategy.triple-supertrend.rejection-wick-threshold=${TRIPLE_ST_REJECTION_WICK_THRESHOLD:0.60}
trading-bot.strategy.triple-supertrend.atr-filter-enabled=${TRIPLE_ST_ATR_FILTER_ENABLED:true}
trading-bot.strategy.triple-supertrend.min-atr-ratio=${TRIPLE_ST_MIN_ATR_RATIO:0.60}
trading-bot.strategy.triple-supertrend.max-atr-ratio=${TRIPLE_ST_MAX_ATR_RATIO:2.50}
trading-bot.strategy.triple-supertrend.ema-filter-enabled=${TRIPLE_ST_EMA_FILTER_ENABLED:true}
trading-bot.strategy.triple-supertrend.ema-period=${TRIPLE_ST_EMA_PERIOD:50}
trading-bot.strategy.triple-supertrend.volume-filter-enabled=${TRIPLE_ST_VOLUME_FILTER_ENABLED:false}
trading-bot.strategy.triple-supertrend.volume-multiplier=${TRIPLE_ST_VOLUME_MULTIPLIER:1.10}

# Multi-Timeframe (MTF) Hourly Uptrend Scanner (Weekly + Daily + Hourly)
trading-bot.strategy.mtf-scanner.enabled=${MTF_SCANNER_ENABLED:true}
trading-bot.strategy.mtf-scanner.cron=${MTF_SCANNER_CRON:0 15 10-15 ? * MON-FRI}
