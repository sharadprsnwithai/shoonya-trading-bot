server.port=${SERVER_PORT:8080}
spring.application.name=shoonya-trading-bot
spring.task.scheduling.pool.size=${TASK_SCHEDULING_POOL_SIZE:5}
spring.task.scheduling.thread-name-prefix=trading-task-

# Lowest Volume Reversal (LVR) Strategy (5-min Intraday Stock Futures Buying & Selling)
trading-bot.strategy.lowest-volume.enabled=${LVR_ENABLED:true}
trading-bot.strategy.lowest-volume.scheduler-enabled=${LVR_SCHEDULER_ENABLED:true}
trading-bot.strategy.lowest-volume.cron=${LVR_CRON:20 */5 9-15 ? * MON-FRI}
trading-bot.strategy.lowest-volume.instrument-type=${LVR_INSTRUMENT_TYPE:FUTURES}
trading-bot.strategy.lowest-volume.exit-mode=${LVR_EXIT_MODE:PARTIAL_1_2_TRAIL_10EMA_COST_EOD_1500}
trading-bot.strategy.lowest-volume.lots=${LVR_LOTS:2}
trading-bot.strategy.lowest-volume.dynamic-position-sizing=${LVR_DYNAMIC_POSITION_SIZING:false}
trading-bot.strategy.lowest-volume.max-attempts-per-symbol=${LVR_MAX_ATTEMPTS_PER_SYMBOL:2}
trading-bot.strategy.lowest-volume.min-breadth-pct=${LVR_MIN_BREADTH_PCT:56.0}
trading-bot.strategy.lowest-volume.min-sl-pct=${LVR_MIN_SL_PCT:0.35}
trading-bot.strategy.lowest-volume.max-daily-loss=${LVR_MAX_DAILY_LOSS:15000.0}
trading-bot.strategy.lowest-volume.max-slippage-pct=${LVR_MAX_SLIPPAGE_PCT:0.12}
trading-bot.strategy.lowest-volume.paper-capital=${LVR_PAPER_CAPITAL:1000000.0}
trading-bot.strategy.lowest-volume.risk-per-trade-percent=${LVR_RISK_PER_TRADE:1.0}
trading-bot.strategy.lowest-volume.max-concurrent-trades=${LVR_MAX_CONCURRENT_TRADES:5}
trading-bot.strategy.lowest-volume.setup-timeout-candles=${LVR_TIMEOUT_CANDLES:6}
trading-bot.strategy.lowest-volume.min-active-candidates=${LVR_MIN_ACTIVE_CANDIDATES:2}
trading-bot.strategy.lowest-volume.telegram-alerts=${LVR_TELEGRAM_ALERTS:true}
trading-bot.strategy.lowest-volume.telegram-armed-alerts=${LVR_TELEGRAM_ARMED_ALERTS:true}
trading-bot.strategy.lowest-volume.vwap-confirmation-enabled=${LVR_VWAP_CONFIRMATION:true}
trading-bot.strategy.lowest-volume.scanner-mode=${LVR_SCANNER_MODE:SECTOR_ROTATION}
trading-bot.strategy.lowest-volume.oi-spurts-top-n=${LVR_OI_SPURTS_TOP_N:5}
trading-bot.strategy.lowest-volume.pdh-pdl-filter-enabled=${LVR_PDH_PDL_FILTER_ENABLED:true}
trading-bot.strategy.lowest-volume.opening-15m-range-filter-enabled=${LVR_OPENING_15M_RANGE_FILTER_ENABLED:false}
trading-bot.strategy.lowest-volume.sector-momentum-filter-enabled=${LVR_SECTOR_MOMENTUM_FILTER:true}
trading-bot.strategy.lowest-volume.scanner-fallback-cutoff=${LVR_SCANNER_FALLBACK_CUTOFF:10:00}

# Historical OHLC Data Storage & Daily SQLite Backup
spring.datasource.url=jdbc:sqlite:${SQLITE_DB_PATH:data/trading_bot.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
trading-bot.ohlc.sqlite-db-path=${SQLITE_DB_PATH:data/trading_bot.db}
trading-bot.ohlc.cache-file-path=${OHLC_CACHE_FILE_PATH:data/historical_ohlc.json}
trading-bot.ohlc.json-backup-enabled=${OHLC_JSON_BACKUP_ENABLED:true}
trading-bot.ohlc.backup-dir=${SQLITE_BACKUP_DIR:data/backups}
trading-bot.ohlc.backup-retention-days=${SQLITE_BACKUP_RETENTION_DAYS:7}
trading-bot.ohlc.daily-backup-cron=${OHLC_DAILY_BACKUP_CRON:0 0 23 * * ?}

# Logging Configuration
logging.file.name=${LOGGING_FILE_NAME:logs/shoonya-trading-bot.log}
logging.level.com.tradingbot=${LOG_LEVEL:INFO}

# Decoupled Multi-Broker Execution Consumers
trading-bot.execution.consumers[0].id=shoonya-primary
trading-bot.execution.consumers[0].broker=SHOONYA
trading-bot.execution.consumers[0].mode=${SHOONYA_EXECUTION_MODE:${EXECUTION_MODE:PAPER}}
trading-bot.execution.consumers[0].strategy-modes.BOLLINGER_HA_1M=${SHOONYA_BOLLINGER_HA_MODE:${SHOONYA_EXECUTION_MODE:${EXECUTION_MODE:PAPER}}}
trading-bot.execution.consumers[0].strategy-modes.LOWEST_VOLUME_REVERSAL=${SHOONYA_LVR_MODE:${SHOONYA_EXECUTION_MODE:${EXECUTION_MODE:PAPER}}}
trading-bot.execution.consumers[0].strategy-modes.CAR_WEEKLY_GTT=${SHOONYA_CAR_MODE:${SHOONYA_EXECUTION_MODE:${EXECUTION_MODE:PAPER}}}
trading-bot.execution.consumers[0].strategy-modes.PUT_CONDOR=${SHOONYA_CONDOR_MODE:${CONDOR_EXECUTION_MODE:${SHOONYA_EXECUTION_MODE:${EXECUTION_MODE:PAPER}}}}
trading-bot.execution.consumers[0].quantity-multiplier=1.0
trading-bot.execution.consumers[0].enabled=true
trading-bot.execution.consumers[0].max-signal-age-seconds=30

trading-bot.execution.consumers[1].id=zerodha-primary
trading-bot.execution.consumers[1].broker=ZERODHA
trading-bot.execution.consumers[1].mode=${ZERODHA_EXECUTION_MODE:${EXECUTION_MODE:PAPER}}
trading-bot.execution.consumers[1].strategy-modes.BOLLINGER_HA_1M=${ZERODHA_BOLLINGER_HA_MODE:${ZERODHA_EXECUTION_MODE:${EXECUTION_MODE:PAPER}}}
trading-bot.execution.consumers[1].strategy-modes.LOWEST_VOLUME_REVERSAL=${ZERODHA_LVR_MODE:${ZERODHA_EXECUTION_MODE:${EXECUTION_MODE:PAPER}}}
trading-bot.execution.consumers[1].strategy-modes.CAR_WEEKLY_GTT=${ZERODHA_CAR_MODE:${ZERODHA_EXECUTION_MODE:${EXECUTION_MODE:PAPER}}}
trading-bot.execution.consumers[1].strategy-modes.PUT_CONDOR=${ZERODHA_CONDOR_MODE:${CONDOR_EXECUTION_MODE:${ZERODHA_EXECUTION_MODE:${EXECUTION_MODE:PAPER}}}}

trading-bot.execution.consumers[1].quantity-multiplier=1.0
trading-bot.execution.consumers[1].enabled=true
trading-bot.execution.consumers[1].max-signal-age-seconds=30

