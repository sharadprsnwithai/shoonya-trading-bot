server.port=${SERVER_PORT:8080}
spring.application.name=shoonya-trading-bot

# Lowest Volume Reversal & Continuation Strategy (5-min Intraday Cash MIS)
trading-bot.strategy.lowest-volume.enabled=${LVR_ENABLED:true}
trading-bot.strategy.lowest-volume.scheduler-enabled=${LVR_SCHEDULER_ENABLED:true}
trading-bot.strategy.lowest-volume.scanner-cron=${LVR_SCANNER_CRON:10 25 9 ? * MON-FRI}
trading-bot.strategy.lowest-volume.cron=${LVR_CRON:10 */5 9-11 ? * MON-FRI}
trading-bot.strategy.lowest-volume.paper-capital=${LVR_PAPER_CAPITAL:1000000.0}
trading-bot.strategy.lowest-volume.risk-per-trade-percent=${LVR_RISK_PER_TRADE:1.0}
trading-bot.strategy.lowest-volume.max-concurrent-trades=${LVR_MAX_CONCURRENT_TRADES:5}
trading-bot.strategy.lowest-volume.min-pct-change=${LVR_MIN_PCT_CHANGE:0.0}
trading-bot.strategy.lowest-volume.top-n-stocks=${LVR_TOP_N_STOCKS:10}
trading-bot.strategy.lowest-volume.setup-timeout-candles=${LVR_TIMEOUT_CANDLES:6}
trading-bot.strategy.lowest-volume.telegram-alerts=${LVR_TELEGRAM_ALERTS:true}
trading-bot.strategy.lowest-volume.telegram-armed-alerts=${LVR_TELEGRAM_ARMED_ALERTS:false}
trading-bot.strategy.lowest-volume.option-buying-enabled=${LVR_OPTION_BUYING:true}
trading-bot.strategy.lowest-volume.live-breach-check-enabled=${LVR_LIVE_BREACH_CHECK:true}
trading-bot.strategy.lowest-volume.lots=${LVR_LOTS:4}
trading-bot.strategy.lowest-volume.scanner-fallback-cutoff=${LVR_SCANNER_FALLBACK_CUTOFF:10:00}
trading-bot.strategy.lowest-volume.scanner-timeout-seconds=${LVR_SCANNER_TIMEOUT_SECONDS:30}

# Multi-Indicator Options Strategy (NIFTY / SENSEX / BANKNIFTY)
trading-bot.strategy.multi-indicator-options.enabled=${MULTI_INDICATOR_OPTIONS_ENABLED:true}
trading-bot.strategy.multi-indicator-options.underlying-index=${MULTI_INDICATOR_OPTIONS_INDEX:NIFTY}
trading-bot.strategy.multi-indicator-options.exchange=${MULTI_INDICATOR_OPTIONS_EXCHANGE:NSE}
trading-bot.strategy.multi-indicator-options.token=${MULTI_INDICATOR_OPTIONS_TOKEN:10576}
trading-bot.strategy.multi-indicator-options.symbol=${MULTI_INDICATOR_OPTIONS_SYMBOL:NIFTY 50}
trading-bot.strategy.multi-indicator-options.mode=${MULTI_INDICATOR_OPTIONS_MODE:OPTION_SELLING}
trading-bot.strategy.multi-indicator-options.scheduler-enabled=${MULTI_INDICATOR_OPTIONS_SCHEDULER_ENABLED:true}
trading-bot.strategy.multi-indicator-options.cron=${MULTI_INDICATOR_OPTIONS_CRON:10 */5 9-15 ? * MON-FRI}
trading-bot.strategy.multi-indicator-options.square-off-cron=${MULTI_INDICATOR_OPTIONS_SQUARE_OFF_CRON:10 5 15 ? * MON-FRI}
trading-bot.strategy.multi-indicator-options.auto-execute=${MULTI_INDICATOR_OPTIONS_AUTO_EXECUTE:false}
trading-bot.strategy.multi-indicator-options.lots=${MULTI_INDICATOR_OPTIONS_LOTS:1}
trading-bot.strategy.multi-indicator-options.lot-size=${MULTI_INDICATOR_OPTIONS_LOT_SIZE:65}
trading-bot.strategy.multi-indicator-options.rsi-period=${MULTI_INDICATOR_OPTIONS_RSI_PERIOD:14}
trading-bot.strategy.multi-indicator-options.adx-filter-enabled=${MULTI_INDICATOR_OPTIONS_ADX_FILTER_ENABLED:true}
trading-bot.strategy.multi-indicator-options.adx-threshold=${MULTI_INDICATOR_OPTIONS_ADX_THRESHOLD:22.0}
trading-bot.strategy.multi-indicator-options.vwap-filter-enabled=${MULTI_INDICATOR_OPTIONS_VWAP_FILTER_ENABLED:true}
trading-bot.strategy.multi-indicator-options.vwap-max-distance=${MULTI_INDICATOR_OPTIONS_VWAP_MAX_DISTANCE:35.0}
trading-bot.strategy.multi-indicator-options.supertrend-filter-enabled=${MULTI_INDICATOR_OPTIONS_SUPERTREND_FILTER_ENABLED:true}
trading-bot.strategy.multi-indicator-options.supertrend-period=${MULTI_INDICATOR_OPTIONS_SUPERTREND_PERIOD:10}
trading-bot.strategy.multi-indicator-options.supertrend-multiplier=${MULTI_INDICATOR_OPTIONS_SUPERTREND_MULTIPLIER:2.0}
trading-bot.strategy.multi-indicator-options.di-filter-enabled=${MULTI_INDICATOR_OPTIONS_DI_FILTER_ENABLED:true}
trading-bot.strategy.multi-indicator-options.stop-loss-percent=${MULTI_INDICATOR_OPTIONS_STOP_LOSS_PERCENT:2.0}
trading-bot.strategy.multi-indicator-options.trailing-sl-enabled=${MULTI_INDICATOR_OPTIONS_TRAILING_SL_ENABLED:true}
trading-bot.strategy.multi-indicator-options.trail-step-1-trigger=${MULTI_INDICATOR_OPTIONS_TRAIL_STEP_1_TRIGGER:12.0}
trading-bot.strategy.multi-indicator-options.trail-step-1-lock=${MULTI_INDICATOR_OPTIONS_TRAIL_STEP_1_LOCK:2.0}
trading-bot.strategy.multi-indicator-options.trail-step-2-trigger=${MULTI_INDICATOR_OPTIONS_TRAIL_STEP_2_TRIGGER:25.0}
trading-bot.strategy.multi-indicator-options.trail-step-2-lock=${MULTI_INDICATOR_OPTIONS_TRAIL_STEP_2_LOCK:15.0}
trading-bot.strategy.multi-indicator-options.target-profit-percent=${MULTI_INDICATOR_OPTIONS_TARGET_PROFIT_PERCENT:50.0}
trading-bot.strategy.multi-indicator-options.hedge-enabled=${MULTI_INDICATOR_OPTIONS_HEDGE_ENABLED:true}
trading-bot.strategy.multi-indicator-options.hedge-otm-percent=${MULTI_INDICATOR_OPTIONS_HEDGE_OTM_PERCENT:2.0}
trading-bot.strategy.multi-indicator-options.prefer-weekly=${MULTI_INDICATOR_OPTIONS_PREFER_WEEKLY:true}
trading-bot.strategy.multi-indicator-options.max-trades-per-day=${MULTI_INDICATOR_OPTIONS_MAX_TRADES_PER_DAY:1}
trading-bot.strategy.multi-indicator-options.telegram-alerts=${MULTI_INDICATOR_OPTIONS_TELEGRAM_ALERTS:true}

# NIFTY Bollinger Band (20, 2) & Heikin-Ashi Positional Strategy
trading-bot.positional.enabled=${POSITIONAL_ENABLED:true}
trading-bot.positional.cron=${POSITIONAL_CRON:0 0 15 * * MON-FRI}
trading-bot.positional.symbol=${POSITIONAL_SYMBOL:NIFTY 50}
trading-bot.positional.execution-mode=${POSITIONAL_EXECUTION_MODE:MANUAL_CONFIRMATION}
trading-bot.positional.num-lots=${POSITIONAL_NUM_LOTS:10}
trading-bot.positional.quantity=${POSITIONAL_QUANTITY:65}
trading-bot.positional.hedge-offset-points=${POSITIONAL_HEDGE_OFFSET_POINTS:300}
trading-bot.positional.max-risk-rupees=${POSITIONAL_MAX_RISK_RUPEES:100000.0}
trading-bot.positional.state-file-path=${POSITIONAL_STATE_FILE_PATH:data/bb_rsi_positional_state.json}

# Logging Configuration
logging.file.name=${LOGGING_FILE_NAME:logs/shoonya-trading-bot.log}


