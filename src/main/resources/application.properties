trading-bot.strategy.monthly-range.telegram-alerts-enabled=${MONTHLY_RANGE_TELEGRAM_ALERTS:true}

# Weekly / daily horizon range forecasting (short-dated structures, e.g. Wed -> Tue expiry).
# Fires on the deployment weekday before the open so the band is in hand while the window is
# still deployable. Bands are k-sigma, each reported with the coverage actually measured on
# out-of-sample walk-forward windows rather than the Gaussian nominal alone.
trading-bot.strategy.monthly-range.weekly-range-enabled=${MONTHLY_WEEKLY_RANGE_ENABLED:true}
trading-bot.strategy.monthly-range.weekly-cron=${MONTHLY_WEEKLY_RANGE_CRON:0 0 8 ? * WED}
trading-bot.strategy.monthly-range.weekly-symbols=${MONTHLY_WEEKLY_SYMBOLS:NIFTY50}
trading-bot.strategy.monthly-range.weekly-expiry-day-of-week=${MONTHLY_WEEKLY_EXPIRY_DOW:TUESDAY}
trading-bot.strategy.monthly-range.weekly-deployment-day-of-week=${MONTHLY_WEEKLY_DEPLOYMENT_DOW:WEDNESDAY}
trading-bot.strategy.monthly-range.range-k-sigmas=${MONTHLY_RANGE_K_SIGMAS:1.0,1.5,2.0}
trading-bot.strategy.monthly-range.calibration-train-pct=${MONTHLY_RANGE_CALIBRATION_TRAIN_PCT:0.60}
trading-bot.strategy.monthly-range.calibration-min-windows=${MONTHLY_RANGE_CALIBRATION_MIN_WINDOWS:25}
trading-bot.strategy.monthly-range.gjr-comparison-enabled=${MONTHLY_RANGE_GJR_COMPARISON_ENABLED:true}

# Reference wing structure (buy far wing, sell two near wings, buy far wing) expressed as point
# offsets from spot plus the net credit collected. Profit zone half-width is 2*short - wing + credit.
trading-bot.strategy.monthly-range.wing-offset-pts=${MONTHLY_WING_OFFSET_PTS:150}
trading-bot.strategy.monthly-range.wing-short-offset-pts=${MONTHLY_WING_SHORT_OFFSET_PTS:200}
trading-bot.strategy.monthly-range.wing-credit-pts=${MONTHLY_WING_CREDIT_PTS:20}

# ==============================================================================
# NSE F&O 52-Week-High Breakout Scanner
# Scans every NSE F&O equity (indices excluded) and reports symbols whose latest COMPLETED
# daily candle crossed above the high of the preceding 52 weeks. Daily candles only.
# Runs at 09:25 IST on trading days so the prior session's candle is finalized before it is read.
# ==============================================================================
trading-bot.strategy.fifty-two-high.enabled=${FIFTY_TWO_HIGH_ENABLED:true}
trading-bot.strategy.fifty-two-high.scheduler-enabled=${FIFTY_TWO_HIGH_SCHEDULER_ENABLED:true}
trading-bot.strategy.fifty-two-high.cron=${FIFTY_TWO_HIGH_CRON:0 25 9 ? * MON-FRI}
trading-bot.strategy.fifty-two-high.telegram-alerts-enabled=${FIFTY_TWO_HIGH_TELEGRAM_ALERTS:true}
# Calendar-day lookback defining the "52 weeks" prior-high window (52*7=364).
trading-bot.strategy.fifty-two-high.lookback-days=${FIFTY_TWO_HIGH_LOOKBACK_DAYS:364}
# Minimum prior sessions before a 52-week high is meaningful (guards thin recent listings).
trading-bot.strategy.fifty-two-high.min-prior-sessions=${FIFTY_TWO_HIGH_MIN_PRIOR_SESSIONS:60}
# Minimum % the latest high must exceed the prior 52w high by (0.0 = any strict cross).
trading-bot.strategy.fifty-two-high.min-breakout-pct=${FIFTY_TWO_HIGH_MIN_BREAKOUT_PCT:0.0}
# true = require the close to also finish above the prior 52w high (close-confirmed only).
trading-bot.strategy.fifty-two-high.require-close-confirmation=${FIFTY_TWO_HIGH_REQUIRE_CLOSE_CONFIRMATION:false}
# Optional explicit universe (comma-separated). Empty = full NSE F&O equity universe.
trading-bot.strategy.fifty-two-high.symbols=${FIFTY_TWO_HIGH_SYMBOLS:}
trading-bot.strategy.fifty-two-high.years-back=${FIFTY_TWO_HIGH_YEARS_BACK:2}
# Re-sync a symbol when its latest cached daily candle is older than this many calendar days.
trading-bot.strategy.fifty-two-high.max-stale-calendar-days=${FIFTY_TWO_HIGH_MAX_STALE_DAYS:4}
# How many breakouts a Telegram message lists before truncating (REST always returns all).
trading-bot.strategy.fifty-two-high.telegram-max-symbols=${FIFTY_TWO_HIGH_TELEGRAM_MAX_SYMBOLS:15}

# ==============================================================================
# Silver ORB — MCX silver futures evening-session paper strategy (validation run)
# Rules (validated vs scripts/silver_orb_vwap_futures_backtest.py on 4 datasets):
#   * ORB = high/low of the 18:00-18:30 IST 5m bars (opening 18:00..18:25).
#   * Bias = first 5m close beyond ORB high/low after 18:30; flips on opposite break.
#   * Entry = 5m close crossing the calendar-day (00:00 IST) VWAP in the bias
#     direction; one trade/day; no entries at/after 21:00; square-off 23:00 IST.
#   * SL -7% / target +25% of MARGIN at 10% margin => 0.70% / 2.50% of price,
#     SL-before-TGT on same bar (conservative). PAPER only, never places orders.
# MCX token 495214 = SILVER04DEC26 (main 30kg contract, expires ~04-Dec-2026):
# roll token+symbol before expiry if the run extends past it.
# ==============================================================================
trading-bot.strategy.silver-orb.enabled=${SILVER_ORB_ENABLED:true}
trading-bot.strategy.silver-orb.scheduler-enabled=${SILVER_ORB_SCHEDULER_ENABLED:true}
trading-bot.strategy.silver-orb.telegram-alerts-enabled=${SILVER_ORB_TELEGRAM_ALERTS_ENABLED:true}
