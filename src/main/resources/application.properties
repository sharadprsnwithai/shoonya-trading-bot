# Post-close (20:00 IST) data job: force-syncs today's completed daily high/low into SQLite and
# captures closing option-chain snapshots for the F&O audit universe. Snapshots are read by the
# LVR gate replay audit only — the live strategy still fetches the chain in real time for the
# armed symbol, so no stale data can reach a live entry gate.
trading-bot.postclose.scheduler-enabled=${POSTCLOSE_SCHEDULER_ENABLED:true}
trading-bot.postclose.cron=${POSTCLOSE_CRON:0 0 20 ? * MON-FRI}

