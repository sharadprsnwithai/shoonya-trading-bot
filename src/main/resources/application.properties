trading-bot.strategy.lowest-volume.scheduler-enabled=${LVR_SCHEDULER_ENABLED:true}
trading-bot.strategy.lowest-volume.cron=${LVR_CRON:20 */5 9-15 ? * MON-FRI}
trading-bot.strategy.lowest-volume.instrument-type=${LVR_INSTRUMENT_TYPE:FUTURES}
trading-bot.strategy.lowest-volume.order-type=${LVR_ORDER_TYPE:LMT}
trading-bot.strategy.lowest-volume.exit-mode=${LVR_EXIT_MODE:PARTIAL_1_2_TRAIL_10EMA_COST_EOD_1500}
trading-bot.strategy.lowest-volume.lots=${LVR_LOTS:2}
trading-bot.strategy.lowest-volume.dynamic-position-sizing=${LVR_DYNAMIC_POSITION_SIZING:false}
trading-bot.strategy.lowest-volume.max-attempts-per-symbol=${LVR_MAX_ATTEMPTS_PER_SYMBOL:2}
trading-bot.strategy.lowest-volume.min-breadth-pct=${LVR_MIN_BREADTH_PCT:56.0}
trading-bot.strategy.lowest-volume.min-sl-pct=${LVR_MIN_SL_PCT:0.35}
trading-bot.strategy.lowest-volume.max-daily-loss=${LVR_MAX_DAILY_LOSS:15000.0}
trading-bot.strategy.lowest-volume.max-slippage-pct=${LVR_MAX_SLIPPAGE_PCT:0.12}
trading-bot.strategy.lowest-volume.paper-capital=${LVR_PAPER_CAPITAL:1000000.0}
trading-bot.strategy.lowest-volume.risk-per-trade-percent=${LVR_RISK_PER_TRADE:1.0}
trading-bot.strategy.lowest-volume.max-concurrent-trades=${LVR_MAX_CONCURRENT_TRADES:8}
trading-bot.strategy.lowest-volume.setup-timeout-candles=${LVR_TIMEOUT_CANDLES:6}
trading-bot.strategy.lowest-volume.min-active-candidates=${LVR_MIN_ACTIVE_CANDIDATES:2}
trading-bot.strategy.lowest-volume.telegram-alerts=${LVR_TELEGRAM_ALERTS:true}
trading-bot.strategy.lowest-volume.telegram-armed-alerts=${LVR_TELEGRAM_ARMED_ALERTS:true}
trading-bot.strategy.lowest-volume.vwap-confirmation-enabled=${LVR_VWAP_CONFIRMATION:true}
trading-bot.strategy.lowest-volume.scanner-mode=${LVR_SCANNER_MODE:HYBRID}
trading-bot.strategy.lowest-volume.oi-spurts-top-n=${LVR_OI_SPURTS_TOP_N:5}
# NSE live OI spurts feed (phase-2 candidate selection, fetched at 09:25 IST before the scan)
trading-bot.strategy.lowest-volume.nse-oi.enabled=${LVR_NSE_OI_ENABLED:true}
trading-bot.strategy.lowest-volume.nse-oi.url=${LVR_NSE_OI_URL:https://www.nseindia.com/api/live-analysis-oi-spurts-underlyings}
trading-bot.strategy.lowest-volume.nse-oi.top-n=${LVR_NSE_OI_TOP_N:3}
trading-bot.strategy.lowest-volume.nse-oi.max-attempts=${LVR_NSE_OI_ATTEMPTS:3}
trading-bot.strategy.lowest-volume.nse-oi.cron=${LVR_NSE_OI_CRON:0 25 9 ? * MON-FRI}
trading-bot.strategy.lowest-volume.nse-oi.mid-morning-refresh-enabled=${LVR_NSE_OI_MIDMORNING_REFRESH:true}
# F&O ban-period exclusion (NCL/CMPT/70085; SEBI/HO/MRD/TPD-1/P/CIR/2025/79, effective 01-Oct-2025).
# A security in ban may only be traded if the trade REDUCES the entity's end-of-day Futures-equivalent
# open interest — LVR's long option/futures entries always increase it, so banned symbols are excluded.
# log-only=true reports the ban list without excluding anything (P1 endpoint validation mode).
trading-bot.strategy.lowest-volume.ban-period-enabled=${LVR_BAN_PERIOD_ENABLED:true}
trading-bot.strategy.lowest-volume.ban-period-log-only=${LVR_BAN_LOG_ONLY:true}
trading-bot.strategy.lowest-volume.ban-period-fail-closed=${LVR_BAN_FAIL_CLOSED:false}
trading-bot.strategy.lowest-volume.nse-ban.url=${LVR_NSE_BAN_URL:https://nsearchives.nseindia.com/content/fo/ban_list_{date}.csv}
trading-bot.strategy.lowest-volume.nse-ban.max-attempts=${LVR_NSE_BAN_ATTEMPTS:3}
trading-bot.strategy.lowest-volume.nse-ban.cron=${LVR_NSE_BAN_CRON:0 10 9 ? * MON-FRI}
# Expiry/DTE rules for a fresh entry (DTE counted in exchange trading sessions, not calendar days).
# option-min-dte-sessions=2 blocks fresh OPTIONS entries in the last two sessions of the monthly
# series (including expiry day); futures-min-dte-sessions=0 leaves FUTURES behaviour unchanged.
trading-bot.strategy.lowest-volume.expiry-dte-enabled=${LVR_EXPIRY_DTE_ENABLED:true}
trading-bot.strategy.lowest-volume.option-min-dte-sessions=${LVR_OPTION_MIN_DTE_SESSIONS:2}
trading-bot.strategy.lowest-volume.futures-min-dte-sessions=${LVR_FUTURES_MIN_DTE_SESSIONS:0}
# Two-sided sector selection + 3-day contracting-triangle channel (design of 2026-10-17).
# nifty-bias-enabled=false: NIFTY breadth becomes reporting-only and both sides of the market are
# traded (strongest sectors long, weakest short). Set true to restore the legacy behaviour where a
# mixed-breadth reading stands the day down and only one direction is tradeable.
trading-bot.strategy.lowest-volume.nifty-bias-enabled=${LVR_NIFTY_BIAS_ENABLED:false}
trading-bot.strategy.lowest-volume.selection.bullish-sectors=${LVR_BULLISH_SECTORS:3}
trading-bot.strategy.lowest-volume.selection.bearish-sectors=${LVR_BEARISH_SECTORS:3}
trading-bot.strategy.lowest-volume.selection.stocks-per-sector=${LVR_STOCKS_PER_SECTOR:3}
trading-bot.strategy.lowest-volume.selection.triangle-enabled=${LVR_TRIANGLE_ENABLED:true}
trading-bot.strategy.lowest-volume.selection.triangle-max-candidates=${LVR_TRIANGLE_MAX:5}
# Index-alignment entry gate (armed -> triggered): a LONG requires NIFTY 50 to be above its
# previous close by the buffer, a SHORT below it by the buffer. Previous close is the reference so
# a morning index reversal blocks a misaligned entry at the trigger rather than letting it fill.
# buffer-bps is the dead-band that stops a ~0.05% wobble from flip-flopping the decision; 0 disables
# it and reverts to a naked cross. Missing index data fails OPEN (entries are never blocked by an
# outage).
trading-bot.strategy.lowest-volume.index-alignment-enabled=${LVR_INDEX_ALIGNMENT_ENABLED:true}
trading-bot.strategy.lowest-volume.index-alignment-buffer-bps=${LVR_INDEX_ALIGNMENT_BUFFER_BPS:10.0}
trading-bot.strategy.lowest-volume.index-alignment-symbol=${LVR_INDEX_ALIGNMENT_SYMBOL:NIFTY 50}
trading-bot.strategy.lowest-volume.pdh-pdl-filter-enabled=${LVR_PDH_PDL_FILTER_ENABLED:true}
trading-bot.strategy.lowest-volume.opening-15m-range-filter-enabled=${LVR_OPENING_15M_RANGE_FILTER_ENABLED:true}
trading-bot.strategy.lowest-volume.pcr-filter-enabled=${LVR_PCR_FILTER_ENABLED:true}
# Neutral no-trade band: PCR inside [neutral-min, neutral-max] blocks BOTH directions.
# LONG requires PCR > pcr-neutral-max; SHORT requires PCR < pcr-neutral-min.
# Legacy LVR_PCR_MIN_LONG / LVR_PCR_MAX_SHORT are still honoured as fallbacks.
trading-bot.strategy.lowest-volume.pcr-neutral-min=${LVR_PCR_NEUTRAL_MIN:${LVR_PCR_MIN_LONG:0.85}}
trading-bot.strategy.lowest-volume.pcr-neutral-max=${LVR_PCR_NEUTRAL_MAX:${LVR_PCR_MAX_SHORT:1.15}}
trading-bot.strategy.lowest-volume.option-sr-filter-enabled=${LVR_OPTION_SR_FILTER_ENABLED:true}
trading-bot.strategy.lowest-volume.option-sr-buffer-pct=${LVR_OPTION_SR_BUFFER_PCT:0.0}
trading-bot.strategy.lowest-volume.sector-momentum-filter-enabled=${LVR_SECTOR_MOMENTUM_FILTER:true}
trading-bot.strategy.lowest-volume.vande-bharat-enabled=${LVR_VANDE_BHARAT_ENABLED:false}
trading-bot.strategy.lowest-volume.target-rr=${LVR_TARGET_RR:2.5}
trading-bot.strategy.lowest-volume.max-daily-losses=${LVR_MAX_DAILY_LOSSES:2}
trading-bot.strategy.lowest-volume.live-breach-check-enabled=${LVR_LIVE_BREACH_CHECK:true}
trading-bot.strategy.lowest-volume.scanner-fallback-cutoff=${LVR_SCANNER_FALLBACK_CUTOFF:10:00}
trading-bot.strategy.lowest-volume.entry-cutoff=${LVR_ENTRY_CUTOFF:11:30}
trading-bot.strategy.lowest-volume.state-file=${LVR_STATE_FILE:./data/lvr-state.json}
trading-bot.strategy.lowest-volume.state-persistence-enabled=${LVR_STATE_PERSISTENCE_ENABLED:true}

