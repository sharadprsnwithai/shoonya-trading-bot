# ==============================================================================
# Cumulative Average Reversal (CAR) Weekly GTT Strategy
# ==============================================================================
trading-bot.strategy.car-weekly.enabled=${CAR_ENABLED:true}
trading-bot.strategy.car-weekly.total-capital=${CAR_TOTAL_CAPITAL:1000000.0}
trading-bot.strategy.car-weekly.num-parts=${CAR_NUM_PARTS:40}
trading-bot.strategy.car-weekly.profit-target-pct=${CAR_PROFIT_TARGET_PCT:6.28}
trading-bot.strategy.car-weekly.trigger-buffer=${CAR_TRIGGER_BUFFER:0.10}
trading-bot.strategy.car-weekly.car-positive-days=${CAR_POSITIVE_DAYS:10}
trading-bot.strategy.car-weekly.high-lookback-days=${CAR_HIGH_LOOKBACK_DAYS:252}
trading-bot.strategy.car-weekly.sunday-cron=${CAR_WEEKLY_SUNDAY_CRON:0 0 10 ? * SUN}
trading-bot.strategy.car-weekly.telegram-alerts=${CAR_TELEGRAM_ALERTS:true}
trading-bot.strategy.car-weekly.accumulation-only-symbols=${CAR_ACCUMULATION_ONLY_SYMBOLS:}

# ==============================================================================
# 1-Minute Bollinger Bands & Heikin-Ashi Intraday Option Buying Strategy
# ==============================================================================
trading-bot.strategy.bollinger-ha.enabled=${BOLLINGER_HA_ENABLED:true}
trading-bot.strategy.bollinger-ha.underlying=${BOLLINGER_HA_UNDERLYING:NIFTY}
trading-bot.strategy.bollinger-ha.timeframe-minutes=${BOLLINGER_HA_TIMEFRAME_MINUTES:1}
trading-bot.strategy.bollinger-ha.bb-period=${BOLLINGER_HA_BB_PERIOD:20}
trading-bot.strategy.bollinger-ha.bb-std-dev=${BOLLINGER_HA_BB_STDDEV:2.0}
trading-bot.strategy.bollinger-ha.max-sl-points=${BOLLINGER_HA_MAX_SL_POINTS:20.0}
trading-bot.strategy.bollinger-ha.min-sl-points=${BOLLINGER_HA_MIN_SL_POINTS:2.0}
trading-bot.strategy.bollinger-ha.buffer-points=${BOLLINGER_HA_BUFFER_POINTS:1.0}
trading-bot.strategy.bollinger-ha.risk-reward-ratio=${BOLLINGER_HA_RISK_REWARD_RATIO:2.0}
trading-bot.strategy.bollinger-ha.max-daily-trades=${BOLLINGER_HA_MAX_DAILY_TRADES:2}
trading-bot.strategy.bollinger-ha.sizing-mode=${BOLLINGER_HA_SIZING_MODE:FIXED_LOTS}
trading-bot.strategy.bollinger-ha.default-lots=${BOLLINGER_HA_DEFAULT_LOTS:2}
trading-bot.strategy.bollinger-ha.fixed-risk-amount=${BOLLINGER_HA_FIXED_RISK_AMOUNT:2000.0}
trading-bot.strategy.bollinger-ha.entry-window-start=${BOLLINGER_HA_ENTRY_WINDOW_START:09:15}
trading-bot.strategy.bollinger-ha.entry-window-cutoff=${BOLLINGER_HA_ENTRY_WINDOW_CUTOFF:10:30}
trading-bot.strategy.bollinger-ha.auto-square-off-time=${BOLLINGER_HA_AUTO_SQUARE_OFF_TIME:15:15}
trading-bot.strategy.bollinger-ha.trend-filter-enabled=${BOLLINGER_HA_TREND_FILTER_ENABLED:true}
trading-bot.strategy.bollinger-ha.trend-ema-period=${BOLLINGER_HA_TREND_EMA_PERIOD:20}

# ==============================================================================
# Monthly Asymmetric Put Condor Strategy (Defined-Risk Positional Index Options)
# ==============================================================================
trading-bot.strategy.put-condor.enabled=${CONDOR_ENABLED:true}
trading-bot.strategy.put-condor.execution-mode=${ZERODHA_CONDOR_MODE:${CONDOR_EXECUTION_MODE:${ZERODHA_EXECUTION_MODE:${EXECUTION_MODE:PAPER}}}}
trading-bot.strategy.put-condor.lots=${CONDOR_LOTS:50}
trading-bot.strategy.put-condor.lot-size=${CONDOR_LOT_SIZE:65}
trading-bot.strategy.put-condor.strike-width=${CONDOR_STRIKE_WIDTH:200}
trading-bot.strategy.put-condor.target-profit-pct=${CONDOR_TARGET_PROFIT_PCT:6.0}
trading-bot.strategy.put-condor.early-exit-target-pct=${CONDOR_EARLY_EXIT_TARGET_PCT:4.5}
trading-bot.strategy.put-condor.early-exit-days-before-expiry=${CONDOR_EARLY_EXIT_DAYS_BEFORE_EXPIRY:3}
trading-bot.strategy.put-condor.stop-loss-pct=${CONDOR_STOP_LOSS_PCT:3.0}
trading-bot.strategy.put-condor.upside-trigger-pts=${CONDOR_UPSIDE_TRIGGER_PTS:150}
trading-bot.strategy.put-condor.entry-time=${CONDOR_ENTRY_TIME:10:30}
trading-bot.strategy.put-condor.monitor-interval-seconds=${CONDOR_MONITOR_INTERVAL_SECONDS:60}
trading-bot.strategy.put-condor.telegram-alerts=${CONDOR_TELEGRAM_ALERTS:true}
trading-bot.strategy.put-condor.max-freeze-limit=${CONDOR_MAX_FREEZE_LIMIT:1800}






