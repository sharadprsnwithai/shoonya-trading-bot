trading-bot.strategy.silver-orb.entry-cutoff=${SILVER_ORB_ENTRY_CUTOFF:21:00}
trading-bot.strategy.silver-orb.square-off=${SILVER_ORB_SQUARE_OFF:23:00}
trading-bot.strategy.silver-orb.run-until=${SILVER_ORB_RUN_UNTIL:2026-11-14}
trading-bot.strategy.silver-orb.state-file=${SILVER_ORB_STATE_FILE:./data/silver-orb-state.json}

