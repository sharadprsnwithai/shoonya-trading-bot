trading-bot.strategy.silver-orb.min-orb-range-pct=${SILVER_ORB_MIN_ORB_RANGE_PCT:0.05}
trading-bot.strategy.silver-orb.orb-start=${SILVER_ORB_ORB_START:18:00}
