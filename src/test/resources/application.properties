# Activate test profile to isolate all tests from production runners and Telegram
spring.profiles.active=test
telegram.enabled=false
TELEGRAM_ENABLED=false
trading-bot.strategy.lowest-volume.telegram-alerts=false
trading-bot.strategy.lowest-volume.telegram-armed-alerts=false
trading-bot.strategy.car-weekly.telegram-alerts=false
trading-bot.brokers.shoonya.telegram-enabled=false
trading-bot.startup-sync.enabled=false

# SQLite Test Database
spring.datasource.url=jdbc:sqlite:data/trading_bot.db
spring.datasource.driver-class-name=org.sqlite.JDBC
trading-bot.ohlc.sqlite-db-path=data/trading_bot.db
trading-bot.ohlc.cache-file-path=data/historical_ohlc.json
trading-bot.ohlc.json-backup-enabled=false
